[tool.poetry]
name = "pdf-chat"
version = "0.1.0"
description = "An application enable users to chat with their PDF documents using AI."
authors = ["TheCamilovisk <camilolgon@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
langchain-openai = "^0.3.16"
tiktoken = "^0.9.0"
python-dotenv = "^1.1.0"
langchain = "^0.3.25"
pypdf2 = "^3.0.1"
streamlit = "^1.45.0"
langchain-community = "^0.3.23"
faiss-cpu = "^1.11.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.11.8"
taskipy = "^1.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'streamlit run app.py'
